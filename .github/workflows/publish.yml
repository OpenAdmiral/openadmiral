# When a release is published, puts it on openadmiral.com: the files under
# downloads/<version>/, the updater manifest (updates/latest.json, which installed
# apps poll) and the release history (downloads/releases.json, the site's
# downloads page). Drafts never reach users.
#
# Needs: secrets CLOUDFLARE_API_TOKEN (R2 write on the bucket) and
# CLOUDFLARE_ACCOUNT_ID, and the repository variable R2_BUCKET.
name: Publish to openadmiral.com

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: ${{ vars.R2_BUCKET }}
      SITE: https://openadmiral.com
    steps:
      - uses: actions/checkout@v4

      - name: Download the release
        run: |
          mkdir -p out
          gh release download "$TAG" --dir out --pattern '*.dmg' --pattern '*.app.tar.gz' --pattern '*.app.tar.gz.sig'
          gh release view "$TAG" --json body,publishedAt > out/release.json
          ls -la out

      - name: Build latest.json and releases.json
        run: |
          curl -sf "$SITE/downloads/releases.json" -o out/previous.json || echo '{"releases":[]}' > out/previous.json
          node .github/scripts/manifests.mjs out "${TAG#v}" "$SITE"

      - name: Upload to R2
        run: |
          put() { npx --yes wrangler@3 r2 object put "$BUCKET/$1" --file "$2" --content-type "$3" --cache-control "$4" --remote; }
          V="${TAG#v}"
          for f in out/*.dmg; do put "downloads/$V/$(basename "$f")" "$f" application/x-apple-diskimage "public, max-age=31536000, immutable"; done
          for f in out/*.app.tar.gz; do put "downloads/$V/$(basename "$f")" "$f" application/gzip "public, max-age=31536000, immutable"; done
          for f in out/*.app.tar.gz.sig; do put "downloads/$V/$(basename "$f")" "$f" text/plain "public, max-age=31536000, immutable"; done
          # Last, so no app is pointed at files that are not there yet.
          put downloads/releases.json out/releases.json application/json "no-cache"
          put updates/latest.json out/latest.json application/json "no-cache"
