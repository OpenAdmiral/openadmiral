[package]
name = "openadmiral"
version = "0.1.11"
description = "OpenAdmiral: a control room for Claude Code agents"
authors = ["OpenAdmiral contributors"]
edition = "2021"
default-run = "openadmiral"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openadmiral_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Underway's privileged helper (registered with SMAppService, bundled in Contents/MacOS).
[[bin]]
name = "openadmiral-helper"
path = "src/bin/openadmiral-helper.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
notify = "8"
portable-pty = "0.9"
dirs = "6"
chrono = "0.4"
tauri-plugin-updater = "2"
libc = "0.2"

# Preview screenshots of the webview itself (shot.rs)
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSProcessInfo", "NSString", "NSObject"] }
# Underway: the helper (SMAppService) and the backup network password (Keychain)
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
security-framework = "3"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
